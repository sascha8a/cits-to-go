when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: android
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      CITS_RELEASE_STORE_PASSWORD:
        from_secret: android_keystore_password
      CITS_RELEASE_KEY_ALIAS:
        from_secret: android_key_alias
      CITS_RELEASE_KEY_PASSWORD:
        from_secret: android_key_password
      ANDROID_KEYSTORE_BASE64:
        from_secret: android_keystore_base64
      CITS_RELEASE_STORE_FILE: /tmp/cits-to-go-release.jks
    commands:
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y tshark
      - |
        test -n "$${ANDROID_KEYSTORE_BASE64}"
        test -n "$${CITS_RELEASE_STORE_PASSWORD}"
        test -n "$${CITS_RELEASE_KEY_ALIAS}"
        test -n "$${CITS_RELEASE_KEY_PASSWORD}"
        printf '%s' "$${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$${CITS_RELEASE_STORE_FILE}"
        chmod 600 "$${CITS_RELEASE_STORE_FILE}"
      - |
        APP_VERSION="$$(sed -n "s/^[[:space:]]*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" android-app/app/build.gradle)"
        test "$${CI_COMMIT_TAG}" = "v$${APP_VERSION}" || {
          echo "Tag $${CI_COMMIT_TAG} does not match Android version v$${APP_VERSION}" >&2
          exit 1
        }
      - cd android-app && ./gradlew testDebugUnitTest assembleRelease
      - |
        mkdir -p dist
        cp android-app/app/build/outputs/apk/release/app-release.apk "dist/CITS-to-go-$${CI_COMMIT_TAG}.apk"
        "$${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/CITS-to-go-$${CI_COMMIT_TAG}.apk"
        rm -f "$${CITS_RELEASE_STORE_FILE}"

  - name: firmware
    image: espressif/idf:v6.1-dev@sha256:d63012d35027ba995ffe3f1182407670cf84bd9e95b3242d3ac5e5d6d53b8ff9
    commands:
      - cd firmware && idf.py set-target esp32c5 build
      - |
        cd firmware/build
        esptool --chip esp32c5 merge-bin --format raw \
          -o "../../dist/CITS-to-go-firmware-$${CI_COMMIT_TAG}.bin" \
          @flash_args
      - test -s "dist/CITS-to-go-firmware-$${CI_COMMIT_TAG}.bin"

  - name: release
    image: woodpeckerci/plugin-release:v0.3.1
    settings:
      api_key:
        from_secret: codeberg_release_token
      base_url: https://codeberg.org
      title: CITS-to-go ${CI_COMMIT_TAG}
      note: |
        Production release ${CI_COMMIT_TAG}.

        Flash the merged ESP32-C5 firmware at address 0x0. The APK is signed
        with the project release key. Verify downloads with SHA256sum.txt.
      files:
        - dist/CITS-to-go-${CI_COMMIT_TAG}.apk
        - dist/CITS-to-go-firmware-${CI_COMMIT_TAG}.bin
      checksum: sha256
      checksum_file: SHA256sum.txt
      checksum_flatten: true
      file_exists: fail
