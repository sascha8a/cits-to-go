plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('CITS_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('CITS_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('CITS_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CITS_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'org.opentrafficmap.citslogger'
    compileSdk 35

    defaultConfig {
        applicationId 'org.opentrafficmap.citslogger'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }


    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
